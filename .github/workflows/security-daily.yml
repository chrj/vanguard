name: Security (Daily)

on:
  schedule:
    - cron: "0 23 * * *" # 11pm UTC (6pm EST / 7pm EDT)
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  govulncheck:
    name: "Go: Vulnerability Check"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck -show verbose ./...

  semgrep:
    name: "Semgrep: Full Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # Keep the pinned version in sync with .github/workflows/ci.yml.
      - name: Install Semgrep
        run: python -m pip install semgrep==1.171.0

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/golang \
            --config p/security-audit \
            --error \
            --sarif --output semgrep.sarif

      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: semgrep.sarif

  gosec:
    name: "gosec: Full Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -exclude-generated ./...
